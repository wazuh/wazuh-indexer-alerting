# Give the Kotlin compile daemon enough heap to lower the deeply nested
# suspend/fan-out code in spi/src/main/kotlin/org/opensearch/alerting/spi/RemoteMonitorRunner.kt.
# Without this, the CodeQL autobuild's bare `./gradlew` runs the daemon on its
# small default heap and the Kotlin IR backend OOMs during :alerting-spi:compileKotlin
# ("Not enough memory to run compilation").
kotlin.daemon.jvmargs=-Xmx2g -Xms512m
